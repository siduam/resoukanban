name: 墨水屏综合看板推送

on:
  schedule:
    - cron: '37 */1 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      pages:
        description: '要推送的页面，逗号分隔；外部定时器传 2 可只刷新 NBA 页'
        required: false
        default: '1,2,3,4'

concurrency:
  group: kanban-push
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 获取代码
        uses: actions/checkout@v6

      - name: 安装 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: 安装依赖包
        run: pip install -r requirements.txt

      - name: 运行测试
        run: python -m unittest discover -s tests -v

      - name: 运行！生成图片并推送
        env:
          ZECTRIX_API_KEY: ${{ secrets.ZECTRIX_API_KEY }}
          ZECTRIX_MAC: ${{ secrets.ZECTRIX_MAC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CAIYUN_API_TOKEN: ${{ secrets.CAIYUN_API_TOKEN }}
          PAGES: ${{ inputs.pages || '1,2,3,4' }}
        run: |
          echo "本次推送页面: $PAGES"
          python main.py --pages "$PAGES"
